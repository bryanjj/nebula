<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nebula · Explorer moved</title></head>
<body>
  <p>The explorer is now at <a id="explorer" href="index.html">index.html</a>.</p>
  <script>
    const target = 'index.html' + location.search + location.hash;
    document.getElementById('explorer').href = target;
    location.replace(target);
  </script>
</body>
</html>
